<div class="login-container">

  <!-- VÍDEO DE FUNDO -->
  <div class="video-fundo">
    <iframe
      src="https://www.youtube.com/embed/TRrxlWzoySA?autoplay=1&mute=1&loop=1&playlist=TRrxlWzoySA&controls=0&rel=0"
      frameborder="0" allow="autoplay; fullscreen" allowfullscreen>
    </iframe>
  </div>

  <!-- CAMADA TRANSPARENTE -->
  <div class="video-overlay"></div>

  <!-- CONTAINER PRINCIPAL -->
  <div class="login-card">

    <div class="imagem-container">
      <img src="/imagens/ranger.png" alt="Ford Ranger">
    </div>

    <div class="login-container-form">

      <img class="logo-ford" src="/imagens/logo-ford-256.png" alt="Ford">

      <!-- <h1>Boas-vindas</h1> -->

    <form (ngSubmit)="login()">

  <div class="campo">
    <label for="nome">Usuário</label>

    <input
      type="text"
      id="nome"
      name="nome"
      [(ngModel)]="nome"
      placeholder="Digite seu usuário"
      required
    >
  </div>


  <div class="campo">
    <label for="senha">Senha</label>

    <input
      type="password"
      id="senha"
      name="senha"
      [(ngModel)]="senha"
      placeholder="Digite sua senha"
      required
    >
  </div>


  <button
    type="submit"
    [disabled]="carregando"
  >
    {{ carregando ? 'Entrando...' : 'Entrar' }}
  </button>


  <p class="mensagem-erro" *ngIf="mensagem">
    {{ mensagem }}
  </p>

</form>
    </div>

  </div>

</div>
