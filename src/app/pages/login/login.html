<div class="login-container">

  <!-- VÍDEO DE FUNDO -->
  <div class="video-fundo">
    <iframe
      src="https://www.youtube.com/embed/TRrxlWzoySA?autoplay=1&mute=1&loop=1&playlist=TRrxlWzoySA&controls=0&rel=0"
      frameborder="0" allow="autoplay; fullscreen" allowfullscreen>
    </iframe>
  </div>

  <!-- CAMADA TRANSPARENTE -->
  <div class="video-overlay"></div>

  <!-- CONTAINER PRINCIPAL -->
  <div class="login-card">

    <div class="imagem-container">
      <img src="/imagens/ranger.png" alt="Ford Ranger">
    </div>

    <div class="login-container-form">

      <img class="logo-ford" src="/imagens/logo-ford-256.png" alt="Ford">

      <!-- <h1>Boas-vindas</h1> -->

      <form>

        <div class="campo">
          <label for="email">E-mail</label>

          <div class="input-icon">
            <i class="fa-solid fa-envelope"></i>

            <input type="email" id="email" placeholder="Insira seu e-mail">
          </div>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>

          <div class="input-icon">
            <i class="fa-solid fa-lock"></i>

            <input type="password" id="senha" placeholder="Insira sua senha">
          </div>
        </div>

        <div class="lembrar">
          <label>
            <input type="checkbox">
            Logar automaticamente
          </label>
        </div>

        <button type="submit">
          Entrar
        </button>

      </form>

    </div>

  </div>

</div>
